<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置确认</title><style>
:root{--paper:#f5f6f8;--ink:#202938;--muted:#596579;--rule:#cbd2dd;--accent:#e5231a;--tint:#fff1ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1360px;margin:auto;padding:40px}header{border-bottom:1px solid var(--rule);padding-bottom:24px}h1{font-size:32px;margin:12px 0}h2{font-size:24px;margin:32px 0 8px}p{font-size:16px;line-height:1.8;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}a{color:#345b92}.figure{overflow-x:auto}svg{display:block;width:100%;min-width:1024px}text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink)}.lane{fill:#fff;fill-opacity:.42;stroke:var(--rule)}.lane-title{font-size:16px;font-weight:600}.node .shape{fill:white;stroke:var(--rule);stroke-width:1.2}.node.decision .shape{fill:var(--tint);stroke:var(--accent)}.node-title{font-size:20px;font-weight:600}.node-sub,.note{font-size:16px;fill:var(--muted)}.edge{fill:none;stroke:var(--muted);stroke-width:1.6}.edge-label rect{fill:var(--paper)}.edge-label text{font-size:16px}.entry{font-size:16px;fill:var(--muted)}footer{border-top:1px solid var(--rule);margin-top:24px;padding-top:16px}@media(max-width:700px){main{padding:20px}h1{font-size:28px}}@media print{main{padding:0}.figure{overflow:visible}svg{min-width:0}section{break-inside:avoid}}
</style></head><body><main><header><div class="eyebrow">JD CHARGING · FOUNDATION / BUSINESS FLOWS</div><h1>配置确认</h1><p>核实字段含义与适用范围，检查当前版本试转换，一次确认启用后按条件复用。</p><p>详细流程 V1.0 · <a href="flow-configuration.md">启用条件、持续复用及角色走查</a></p><p>图例：矩形为人员动作，菱形为条件分支；试转换与版本检查不增加人工审批。</p></header><section><h2>1. 核实含义、试转换与确认启用</h2><p>服务商对接人员核实当前候选与试转换，一次确认完整配置；条件不满足时只处理实际问题。</p><div class="figure"><svg viewBox="0 0 1280 800" role="img" aria-labelledby="flow-installation-configuration-title flow-installation-configuration-desc"><title id="flow-installation-configuration-title">1. 核实含义、试转换与确认启用</title><desc id="flow-installation-configuration-desc">服务商对接人员核实当前候选与试转换，一次确认完整配置；条件不满足时只处理实际问题。</desc><defs><marker id="flow-installation-configuration-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#596579"/></marker></defs><text class="entry" x="40" y="64">入口：原资料、字段含义建议与待确认问题已准备，当前人员有对应配置的办理权限。</text><rect class="lane" x="40" y="128" width="1200" height="480" rx="8"/><text class="lane-title" x="56" y="172">服务商</text><text class="lane-title" x="56" y="196">对接人员</text><path class="edge" data-from="S1" data-to="S2" d="M 464 204 H 608" marker-end="url(#flow-installation-configuration-arrow)"/><path class="edge" data-from="S2" data-to="S3" d="M 848 204 H 984" marker-end="url(#flow-installation-configuration-arrow)"/><path class="edge" data-from="S3" data-to="S4" d="M 1096 268 V 376 Q 1096 384 1088 384 H 376 Q 368 384 368 392 V 440" marker-end="url(#flow-installation-configuration-arrow)"/><path class="edge" data-from="S4" data-to="S1" d="M 224 484 H 192 Q 184 484 184 476 V 112 Q 184 104 192 104 H 336 Q 344 104 344 112 V 160" marker-end="url(#flow-installation-configuration-arrow)"/><path class="edge" data-from="S3" data-to="S5" d="M 1208 204 H 1248 Q 1256 204 1256 212 V 476 Q 1256 484 1248 484 H 1232" marker-end="url(#flow-installation-configuration-arrow)"/><path class="edge" data-from="S5" data-to="S6" d="M 944 484 H 872" marker-end="url(#flow-installation-configuration-arrow)"/><g class="edge-label"><rect x="608.0" y="340" width="240" height="24" rx="4"/><text x="728" y="360" text-anchor="middle">含义、结果或条件不符</text></g><g class="edge-label"><rect x="200.0" y="316" width="224" height="24" rx="4"/><text x="312" y="336" text-anchor="middle">问题解决后继续核实</text></g><g class="edge-label"><rect x="1112.0" y="308" width="112" height="24" rx="4"/><text x="1168" y="328" text-anchor="middle">条件满足</text></g><g class="node action" data-id="S1" data-role="0"><rect class="shape" x="224" y="160" width="240" height="88" rx="8"/><text class="node-title" x="344.0" y="196" text-anchor="middle">核实建议、含义与范围</text><text class="node-sub" x="344.0" y="224" text-anchor="middle">原字段、业务含义及适用条件</text></g><g class="node action" data-id="S2" data-role="0"><rect class="shape" x="608" y="160" width="240" height="88" rx="8"/><text class="node-title" x="728.0" y="196" text-anchor="middle">核实当前版本试转换</text><text class="node-sub" x="728.0" y="224" text-anchor="middle">原始输入、转换输出与缺项</text></g><g class="node decision" data-id="S3" data-role="0"><polygon class="shape" points="1096.0,140 1208,204.0 1096.0,268 984,204.0"/><text class="node-title" x="1096.0" y="200.0" text-anchor="middle">是否满足</text><text class="node-title" x="1096.0" y="224.0" text-anchor="middle">启用条件？</text></g><g class="node action" data-id="S4" data-role="0"><rect class="shape" x="224" y="440" width="288" height="88" rx="8"/><text class="node-title" x="368.0" y="476" text-anchor="middle">处理阻碍启用的问题</text><text class="node-sub" x="368.0" y="504" text-anchor="middle">补齐、修订或等待条件恢复</text></g><g class="node action" data-id="S5" data-role="0"><rect class="shape" x="944" y="440" width="288" height="88" rx="8"/><text class="node-title" x="1088.0" y="476" text-anchor="middle">核对完整启用内容</text><text class="node-sub" x="1088.0" y="504" text-anchor="middle">配置版本、全部规则与适用范围</text></g><g class="node action" data-id="S6" data-role="0"><rect class="shape" x="584" y="440" width="288" height="88" rx="8"/><text class="node-title" x="728.0" y="476" text-anchor="middle">确认启用指定版本</text><text class="node-sub" x="728.0" y="504" text-anchor="middle">一次业务决定，查看实际生效结果</text></g><text class="note" x="40" y="752">试转换由系统准备；新候选重新验证，不把旧成功结果用于新内容。</text><text class="note" x="40" y="776">启用只建立适用的转换关系；安装事实、审核与费用仍由原角色分别核实。</text></svg></div></section><footer><p>当前原型未校验有效试转换记录；正式启用校验、并发与适用范围匹配仍须实现及验证。</p></footer></main></body></html>
